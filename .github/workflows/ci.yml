name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests for every module and a debug build. Live provider tests stay opt-in
      # (WINNOW_LIVE_TESTS) and never run here.
      - run: ./gradlew :classifier:test :mms:test :app:testDebugUnitTest :app:assembleDebug
